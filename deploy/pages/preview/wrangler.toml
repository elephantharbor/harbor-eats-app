# Harbor Eats — ISOLATED PREVIEW Pages config (project harbor-eats-cycle1-preview).
# Used ONLY by `npm run deploy:preview`. Must never reference the production D1 id
# (enforced by test/deploy-safety.test.js and npm run preflight).

name = "harbor-eats-cycle1-preview"
pages_build_output_dir = "./public"
compatibility_date = "2026-09-28"

[[d1_databases]]
binding = "DB"
database_name = "harbor-eats-cycle1-preview"
database_id = "65bc636d-7048-4e58-900b-9066edf6509f"
migrations_dir = "../../../migrations" # relative to this file

[vars]
APP_NAME = "harbor-eats-app"
ENVIRONMENT = "preview"
DEPLOY_ENV = "preview"
D1_DATABASE_ID = "65bc636d-7048-4e58-900b-9066edf6509f"
CATALOG_SOURCE = "d1"
# D-05 AI gateway (non-secret). OPENAI_API_KEY is a Pages SECRET, never in this file.
# Gateway stays OFF until the key is set and the preview smoke passes: see docs/D05-DECISION-CARD.md.
AI_PROVIDER = "openai"
AI_GATEWAY_ENABLED = "1"
AI_TASKS_ENABLED = "planning_intent,discovery_intent,recipe_adaptation,explanation"
AI_DAILY_BUDGET_USD = "0.25"
AI_GLOBAL_PER_DAY = "250"
AI_HOUSEHOLD_PER_MINUTE = "5"
AI_HOUSEHOLD_PER_DAY = "30"
AI_SOL_HOUSEHOLD_PER_DAY = "5"
# S-03 grocery. Empty means no external provider. In-store does not read this.
# A Preview mock is a dashboard var, not this file: GROCERY_PROVIDERS=instacart
# and GROCERY_FIXTURE=instacart_mock. Production code refuses the fixture.
# INSTACART_API_KEY is a Pages secret. Never put it here.
GROCERY_PROVIDERS = ""
