name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run preflight
      - run: npm run test:migrations
      - run: npm run test:unit
      - run: npm run lint
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
        env:
          CI: "true"
      - name: Structural catalog smoke (seeded local D1, all published meals)
        run: npm run smoke:catalog
