# Harbor Eats — Cloudflare Pages (same-origin /api/* + D1)
# Deploy: npm run pages:deploy
# Worker (workers.dev): wrangler.worker.toml via npm run deploy
# Do NOT put secrets in this file.

name = "harbor-eats-app"
pages_build_output_dir = "./public"
compatibility_date = "2026-09-28"

[[d1_databases]]
binding = "DB"
database_name = "harbor-eats-db"
database_id = "23aa3db3-1090-471b-8c8a-b6fe71f5c053"
migrations_dir = "migrations"

[vars]
APP_NAME = "harbor-eats-app"
ENVIRONMENT = "dev"
CATALOG_SOURCE = "d1"
